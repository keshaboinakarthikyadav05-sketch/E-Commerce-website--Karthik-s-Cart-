services:
  - type: web
    name: karthiks-cart
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt && npm --prefix frontend ci && npm --prefix frontend run build
    startCommand: python -m gunicorn --chdir backend --bind 0.0.0.0:$PORT run:app
    healthCheckPath: /api/health
    initialDeployHook: cd backend && python -m seed.seed_data
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: karthiks-cart-db
          property: connectionString
      - key: SEED_DEMO_USERS
        value: "false"

databases:
  - name: karthiks-cart-db
    plan: free
    databaseName: shopora_db
    user: shopora
